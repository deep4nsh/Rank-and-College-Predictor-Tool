databases:
  - name: pw-gate-db
    databaseName: pw_gate_db
    user: pw_admin
    plan: free

services:
  # 1. Student Exam Portal Web Service
  - type: web
    name: pw-gate-student
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: PORTAL_MODE
        value: student
      - key: DATABASE_URL
        fromDatabase:
          name: pw-gate-db
          property: connectionString

  # 2. Counsellor Operations Station Web Service (Password: Councellor@123)
  - type: web
    name: pw-gate-counsellor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: PORTAL_MODE
        value: counsellor
      - key: COUNSELLOR_PASSWORD
        value: Councellor@123
      - key: DATABASE_URL
        fromDatabase:
          name: pw-gate-db
          property: connectionString
