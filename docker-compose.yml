version: '3.8'

services:
  gate-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pw_gate_predictor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/db_data/gate_predictor.db
      - WORKERS=4
      - PORT=8000
    volumes:
      # Persistent SQLite database directory (WAL journal preserved across restarts)
      - ./db_data:/app/db_data
      # Cutoff and branch matrix JSON data
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
